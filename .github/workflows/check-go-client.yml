name: "Check go client"

on:
  pull_request:
    branches:
      - main

jobs:
  check-client:
    name: Check go client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: ./go-client/go.mod
        
      - name: Detect generation changes
        shell: bash
        working-directory: ./go-client
        run: |
          make generate

          if git diff --quiet --exit-code ./client; then
            exit 0
          else
            echo "Diff detected after running generate command. Please run make generate locally & push the changes"
            exit 1
          fi
